[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalbox-video"
version = "0.1.0"
description = "A signal-first video degradation workbench with a fast terminal interface"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
signalbox = "signalbox.cli:main"

[tool.setuptools.packages.find]
include = ["signalbox*"]
