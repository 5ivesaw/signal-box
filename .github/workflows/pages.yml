name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: numpy scipy"
      # Full native FFmpeg integration runs in the dedicated Tests workflow.
      # The static artifact only needs the shared Python engine and JS checks.
      - run: |
          python -m unittest discover -s tests -p test_core.py -v
          python -m unittest discover -s tests -p test_browser_bridge.py -v
      - run: python scripts/build_web.py
      - run: npm --prefix web run check
      - uses: actions/configure-pages@v5
      - run: mkdir _site && rsync -a --exclude vendor web/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
